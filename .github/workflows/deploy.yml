name: Deploy to GitHub Pages

# 触发条件：推送到 master 自动部署，也支持手动触发
on:
  push:
    branches: [master]
  workflow_dispatch:

# 全局权限（部署 GitHub Pages 必需）
permissions:
  contents: read
  pages: write
  id-token: write

# 防止重叠部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 首次运行自动启用 Pages（GitHub Actions 源）
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite)
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 部署到 github-pages 环境（job 级别）
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

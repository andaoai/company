name: Deploy to GitHub Pages

# 触发条件：推送到 master 自动部署，也支持手动触发
on:
  push:
    branches: [master]
  workflow_dispatch:

# 权限：部署 GitHub Pages 必需
permissions:
  contents: read
  pages: write
  id-token: write

# 防止重叠部署
concurrency:
  group: pages
  cancel-in-progress: false

# 默认环境（Pages 部署专用）
environment:
  name: github-pages
  url: ${{ steps.deployment.outputs.page_url }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy to GitHub Pages

# 触发条件：推送到 master 自动部署，也支持手动触发
on:
  push:
    branches: [master]
  workflow_dispatch:

# 权限：部署 GitHub Pages 必需
permissions:
  contents: read
  pages: write
  id-token: write

# 防止重叠部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 部署到 github-pages 环境（必须在 job 级别，不能在顶层）
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
